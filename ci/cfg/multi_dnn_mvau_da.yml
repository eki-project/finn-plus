# Multi-DNN MVAU sweep (cf. multi_dnn_mvau.yml, Fig. 4 of the multi-DNN paper) combined with
# the distributed-arithmetic MVAU (MVAU_rtl with mem_mode=internal_embedded, PR #283) near
# maximum parallelism. The DA core needs the weight matrix fully unrolled (SIMD=MW, PE=MH),
# so the matrix size is swept instead of the folding; pe_simd_div gives the folding relative
# to it (PE = MH / div_pe, SIMD = MW / div_simd). Selectable weights (scenario 3) need
# streamed weights and therefore exist only as HLS baseline.
# Launch: MANUAL_CFG_PATH=multi_dnn_mvau_da, TEST_SUITE=none (12 + 24 + 8 + 2 = 46 runs).
[
    # A: DA MVAU, co-location (0) and partial reconfiguration (4), fully unrolled
    {
        "dut": ["mvau_multi_dnn"],
        "board": ["RFSoC4x2"],
        "synth_clk_period_ns": [5],
        "instrumentation_avg_n": [64],
        "experiments_config": ["../experiments/multi_dnn.json"],

        "idt": ["INT4"],
        "wdt": ["INT4"],

        "sparsity_amount": [0, 0.5],

        "nhw": [[1,32,32]],
        "mw_mh": [[16, 16], [32, 32], [64, 64]],
        "pe_simd_div": [[1, 1]],
        "m": [1],

        "scenario_mem_mode": [[0, "internal_embedded"], [4, "internal_embedded"]],
        "ram_style": ["distributed"],
        "ram_style_thr": ["distributed"],

        "backend": ["rtl"],
        "da_hard_dc": [2],

        "generate_outputs": [["estimate_reports", "bitfile", "pynq_driver", "deployment_package"]]
    },
    # B: HLS baseline, all scenarios, fully unrolled and half PE
    {
        "dut": ["mvau_multi_dnn"],
        "board": ["RFSoC4x2"],
        "synth_clk_period_ns": [5],
        "instrumentation_avg_n": [64],
        "experiments_config": ["../experiments/multi_dnn.json"],

        "idt": ["INT4"],
        "wdt": ["INT4"],

        "sparsity_amount": [0, 0.5],

        "nhw": [[1,32,32]],
        "mw_mh": [[16, 16], [32, 32]],
        "pe_simd_div": [[1, 1], [2, 1]],
        "m": [1],

        "scenario_mem_mode": [[0, "internal_embedded"], [3, "internal_decoupled"], [4, "internal_embedded"]],
        "ram_style": ["distributed"],
        "ram_style_thr": ["distributed"],

        "backend": ["hls"],

        "generate_outputs": [["estimate_reports", "bitfile", "pynq_driver", "deployment_package"]]
    },
    # C: HLS baseline at 64x64 with embedded weights, fully unrolled and half PE
    {
        "dut": ["mvau_multi_dnn"],
        "board": ["RFSoC4x2"],
        "synth_clk_period_ns": [5],
        "instrumentation_avg_n": [64],
        "experiments_config": ["../experiments/multi_dnn.json"],

        "idt": ["INT4"],
        "wdt": ["INT4"],

        "sparsity_amount": [0, 0.5],

        "nhw": [[1,32,32]],
        "mw_mh": [[64, 64]],
        "pe_simd_div": [[1, 1], [2, 1]],
        "m": [1],

        "scenario_mem_mode": [[0, "internal_embedded"], [4, "internal_embedded"]],
        "ram_style": ["distributed"],
        "ram_style_thr": ["distributed"],

        "backend": ["hls"],

        "generate_outputs": [["estimate_reports", "bitfile", "pynq_driver", "deployment_package"]]
    },
    # D: HLS selectable weights at 64x64: the streamed weights of PE=MH and PE=MH/2 need
    # AP_INT_MAX_W 16384/8192 > 8191, so PE=MH/4 (4096 bits) is the highest parallelism
    {
        "dut": ["mvau_multi_dnn"],
        "board": ["RFSoC4x2"],
        "synth_clk_period_ns": [5],
        "instrumentation_avg_n": [64],
        "experiments_config": ["../experiments/multi_dnn.json"],

        "idt": ["INT4"],
        "wdt": ["INT4"],

        "sparsity_amount": [0, 0.5],

        "nhw": [[1,32,32]],
        "mw_mh": [[64, 64]],
        "pe_simd_div": [[4, 1]],
        "m": [1],

        "scenario_mem_mode": [[3, "internal_decoupled"]],
        "ram_style": ["distributed"],
        "ram_style_thr": ["distributed"],

        "backend": ["hls"],

        "generate_outputs": [["estimate_reports", "bitfile", "pynq_driver", "deployment_package"]]
    },
]
