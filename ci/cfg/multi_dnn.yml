[
    # VGG-10 (1D CNN) (RadioML)
    # Type 0: the folding configs do not specify any FIFO depths, so all FIFOs are
    # inserted with their minimal (default) depth instead of being sized.
    {
        "dut": ["vgg10"], # almost all settings of default DUT are overwritten here (or by multi_dnn_config)
        "board": ["RFSoC4x2"],
        "synth_clk_period_ns": [5],
        "instrumentation_avg_n": [64],
        "experiments_config": ["../experiments/multi_dnn.json"],

        "auto_fifo_depths": [true],
        "auto_fifo_strategy": ["force_minimal_fifos"],
        "standalone_thresholds": [true],
        "minimize_bit_width": [false],
        "multi_dnn_config_path": ["models/multi_dnn/vgg10/multi_dnn_cfgs/vgg10_multidnn_config_type0.json"],
        "folding_config_file": ["models/multi_dnn/vgg10/type0/vgg10_fc_full_type0_embedded.json",
                                "models/multi_dnn/vgg10/type0/vgg10_fc_full_type0_decoupled_distributed.json",
                                "models/multi_dnn/vgg10/type0/vgg10_fc_full_type0_decoupled_block.json",
                                "models/multi_dnn/vgg10/type0/vgg10_fc_half_type0_embedded.json",
                                "models/multi_dnn/vgg10/type0/vgg10_fc_half_type0_decoupled_distributed.json",
                                "models/multi_dnn/vgg10/type0/vgg10_fc_half_type0_decoupled_block.json",
                                "models/multi_dnn/vgg10/type0/vgg10_fc_quarter_type0_embedded.json",
                                "models/multi_dnn/vgg10/type0/vgg10_fc_quarter_type0_decoupled_distributed.json",
                                "models/multi_dnn/vgg10/type0/vgg10_fc_quarter_type0_decoupled_block.json"],
        "generate_outputs": [["estimate_reports", "bitfile", "pynq_driver", "deployment_package"]]
    },

