# End-to-end comparison of the distributed-arithmetic MVU on the cybsec MLP
# (600 -> 64 -> 64 -> 64 -> 1, 2-bit weights). Three design points:
#   1. the regular regression build (auto folding for 1 M fps, HLS MVAUs with
#      streamed weights, thresholds fused into the MVAUs)
#   2. every layer fully unrolled (one frame per cycle) with the HLS MVAU and
#      embedded weights, standalone RTL thresholds
#   3. exactly the same design point with the build option enable_da_mvau, which
#      switches the fully unrolled MVAUs to the distributed-arithmetic RTL MVAU
#      after folding (the only difference to variant 2)
# The unrolled variants get a 100 M fps target so that SetFolding unrolls every
# MVAU and threshold layer; mvau_wwidth_max is raised so that the 600-wide first
# layer is not capped, and the embedded weights of the HLS MVAU (for which there
# is no build option) come from the shared specialize config.
[
    {
        "dut": ["cybsec"],
        "generate_outputs": [["estimate_reports", "bitfile", "pynq_driver", "deployment_package"]]
    },
    {
        "dut": ["cybsec"],
        "target_fps": [100000000],
        "mvau_wwidth_max": [1200],
        "standalone_thresholds": [true],
        "specialize_layers_config_file": ["models/cybsec/unrolled_hls_specialize_layers.json"],
        "generate_outputs": [["estimate_reports", "bitfile", "pynq_driver", "deployment_package"]]
    },
    {
        "dut": ["cybsec"],
        "target_fps": [100000000],
        "mvau_wwidth_max": [1200],
        "standalone_thresholds": [true],
        "specialize_layers_config_file": ["models/cybsec/unrolled_hls_specialize_layers.json"],
        "enable_da_mvau": [true],
        "generate_outputs": [["estimate_reports", "bitfile", "pynq_driver", "deployment_package"]]
    },
]
