# Regression experiments that build on a standard node (see BENCH_CPU_CORES /
# BENCH_FINN_WORKERS / MEM_BENCH for "regression_small" in .gitlab-ci.yml).
# Keep the number of experiments in sync with PARALLEL_JOBS of that config, so that
# every experiment gets a Slurm array task of its own.
[
    # VGG-10 (1D CNN) (RadioML)
    {
        "dut": ["vgg10"],
        "generate_outputs": [["estimate_reports", "bitfile", "pynq_driver", "deployment_package"]]
    },

    # Cybersecurity (MLP)
    {
        "dut": ["cybsec"],
        "generate_outputs": [["estimate_reports", "bitfile", "pynq_driver", "deployment_package"]]
    },

    ### BNN-PYNQ ###
    # cnv-w1a1
    {
        "dut": ["bnn-pynq"],
        "model_path": [models/bnn-pynq/cnv-w1a1_qonnx.onnx],
        "folding_config_file": [models/bnn-pynq/cnv-w1a1_folding_config.json],
        "specialize_layers_config_file": [models/bnn-pynq/cnv-w1a1_specialize_layers.json],
        "generate_outputs": [["estimate_reports", "bitfile", "pynq_driver", "deployment_package"]],
        "validation_dataset" : ["cifar"],
    },

    # cnv-w1a2
    {
