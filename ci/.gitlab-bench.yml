include: ci/.gitlab-setup.yml

stages:
  - build
  - measure
  - collect
  - build_followup
  - measure_followup
  - collect_followup
  - qor
  - cleanup

# Large per-run artifacts (reports, bitstreams) are exchanged between the runners through a
# directory on the cluster fileshare instead of GitLab artifacts (see
# src/finn/benchmarking/exchange.py). Every job exports FINN_BENCH_EXCHANGE_DIR from the
# runner-specific project variable (OTUS_EXCHANGE_DIR, BOARD_EXCHANGE_DIR, LOCAL_EXCHANGE_DIR);
# the GitLab artifacts only carry small summaries.

variables:
  BENCH_CFG:
    description: "Select config, usually provided by parent pipeline"
    value: ""

workflow:
  name: "bench_$BENCH_CFG"

FINN Build:
  id_tokens:
    CI_JOB_JWT:
      aud: https://git.uni-paderborn.de
  stage: build
  tags:
    - otus
  needs:
    - job: Build
      pipeline: $PARENT_PIPELINE_ID
  variables:
    SCHEDULER_PARAMETERS: "-A $PROJECT_ACCOUNT -p $BENCH_SLURM_PARTITION -t $SLURM_TIMEOUT $SLURM_QOS --nodes 1 --ntasks 1 --exclude $SLURM_EXCLUDE_NODES --cpus-per-task $BENCH_CPU_CORES --mem $MEM_BENCH --array 0-$( expr $PARALLEL_JOBS - 1 )"
    NUM_DEFAULT_WORKERS: "$BENCH_FINN_WORKERS"
  extends: .setup_full_2024_2
  script:
    # Launch additional monitoring
    - $JOB_MONITORING_DIR/monitor.sh $JOB_MONITORING_DIR/$CI_PIPELINE_ID/$HOSTNAME.log &
    # Launch benchmarking script via FINN CLI, includes deps update and environment preparation
    # Also fetch & checkout DVC-managed data, which should already be cached in $CI_DVC_CACHE_DIR
    - |
      source finn-plus-venv/bin/activate
      dvc config cache.dir $CI_DVC_CACHE_DIR
      dvc pull
      # Fitted QoR models (see ci/qor/) for empirical estimate reports, path as seen from this runner
      export FINN_QOR_MODEL_DIR=$OTUS_QOR_MODEL_DIR_STORE
      # Exchange directory for per-run artifacts and the microbenchmark database (for the
      # novelty check of randomly sampled configurations), paths as seen from this runner
      export FINN_BENCH_EXCHANGE_DIR=$OTUS_EXCHANGE_DIR
      export FINN_MICROBENCHMARK_DATABASE=$OTUS_BENCHMARK_DIR_STORE
      finn bench --dependency-path ./deps --build-path $FINN_BUILD_DIR --num-default-workers $BENCH_FINN_WORKERS --bench_config $BENCH_CFG
  cache:
    key:
      files:
        - src/finn/interface/external_dependencies.yaml
    policy: pull
    paths:
      - deps
  artifacts:
    name: "build_artifacts"
    when: always
    paths:
      - build_artifacts/

Measurement:
  id_tokens:
    CI_JOB_JWT:
      aud: https://git.uni-paderborn.de
  stage: measure
  tags:
    - board
  rules:
    # Also run on failure of previous tasks to measure partial results
    - when: always
  script:
    # Build power measurement driver (TODO: support other boards)
    - make -C ci/power_measurement/boards/rfsoc2x2 shared
    - make -C ci/power_measurement/boards/rfsoc4x2 shared
    # Install dependencies for FINN driver
    - sudo bash -c "source /etc/profile.d/pynq_venv.sh && chmod +x scripts/driver_install_dependencies.sh && scripts/driver_install_dependencies.sh"
    # Run as root and activate the PYNQ venv manually to use PYNQ outside of the typical Jupyter environment
    # (environment variables have to be forwarded through sudo explicitly)
    - sudo bash -c "source /etc/profile.d/pynq_venv.sh && export DATASET_DIR=$DATASET_DIR && export XILINX_XRT=/usr && export FINN_BENCH_EXCHANGE_DIR=$BOARD_EXCHANGE_DIR && export CI_PIPELINE_ID=$CI_PIPELINE_ID && python ci/measure.py"
  artifacts:
    name: "measurement_artifacts"
    when: always
    paths:
      - measurement_summary.json
      # only populated if no exchange directory is configured
      - measurement_artifacts/

Result Collection:
  id_tokens:
    CI_JOB_JWT:
      aud: https://git.uni-paderborn.de
  stage: collect
  tags:
    - image_build
  rules:
    # Also run on failure of previous tasks to collect partial results
    - when: always
  script:
    # pulling models seems to be needed for dvclive to save experiments, even though they are not used or modified
    - dvc pull
    - git fetch origin +refs/tags/*:refs/tags/*
    - git fetch git@github.com:eki-project/finn-plus.git +refs/exps/*:refs/exps/*
    - |
      collect_status=0
      push_status=0

      export FINN_BENCH_EXCHANGE_DIR=$LOCAL_EXCHANGE_DIR
      python3.10 ci/collect/collect.py || collect_status=$?
      dvc exp push -f -j 4 -r push git@github.com:eki-project/finn-plus.git || push_status=$?

      if [ "$collect_status" -ne 0 ]; then
        exit "$collect_status"
      fi
      exit "$push_status"
  artifacts:
    name: "collected_artifacts"
    when: always
    paths:
      - build_artifacts/
      - measurement_artifacts/
      - followup_bench_config.json
      - followup_inputs/
      - run_index.json
      - metric_report_plots.png
      - metric_report.json

# Follow-up stages for live FIFO sizing experiments
# These stages re-run experiments with the FIFO sizes determined during measurement

FINN Build (Follow-up):
  id_tokens:
    CI_JOB_JWT:
      aud: https://git.uni-paderborn.de
  stage: build_followup
  tags:
    - otus
  rules:
    # Also run on failure of previous tasks to measure partial results
    - when: always
  needs:
    - job: Build
      pipeline: $PARENT_PIPELINE_ID
    - job: Result Collection
  variables:
    SCHEDULER_PARAMETERS: "-A $PROJECT_ACCOUNT -p $BENCH_SLURM_PARTITION -t $SLURM_TIMEOUT $SLURM_QOS --nodes 1 --ntasks 1 --exclude $SLURM_EXCLUDE_NODES --cpus-per-task $BENCH_CPU_CORES --mem $MEM_BENCH --array 0-$( expr $PARALLEL_JOBS - 1 )"
    NUM_DEFAULT_WORKERS: "$BENCH_FINN_WORKERS"
  extends: .setup_full_2024_2
  script:
    # Check if follow-up config exists, exit gracefully if not
    - |
      if [ ! -f followup_bench_config.json ]; then
        echo "No follow-up config found, skipping follow-up build"
        exit 0
      fi
    # Launch additional monitoring
    - $JOB_MONITORING_DIR/monitor.sh $JOB_MONITORING_DIR/$CI_PIPELINE_ID/$HOSTNAME.log &
    # Launch benchmarking script via FINN CLI for follow-up experiments
    # Uses the followup_bench_config.json generated by Result Collection
    - |
      source finn-plus-venv/bin/activate
      dvc config cache.dir $CI_DVC_CACHE_DIR
      dvc pull
      export FINN_QOR_MODEL_DIR=$OTUS_QOR_MODEL_DIR_STORE
      export FINN_BENCH_EXCHANGE_DIR=$OTUS_EXCHANGE_DIR
      export FINN_MICROBENCHMARK_DATABASE=$OTUS_BENCHMARK_DIR_STORE
      finn bench --dependency-path ./deps --build-path $FINN_BUILD_DIR --num-default-workers $BENCH_FINN_WORKERS --bench_config followup
  cache:
    key:
      files:
        - src/finn/interface/external_dependencies.yaml
    policy: pull
    paths:
      - deps
  artifacts:
    name: "build_artifacts_followup"
    when: always
    paths:
      - build_artifacts_followup/

Measurement (Follow-up):
  id_tokens:
    CI_JOB_JWT:
      aud: https://git.uni-paderborn.de
  stage: measure_followup
  rules:
    # Also run on failure of previous tasks to measure partial results
    - when: always
  needs:
    - job: FINN Build (Follow-up)
  tags:
    - board
  script:
    # (measure.py exits gracefully if no follow-up build artifacts exist)
    # Build power measurement driver (TODO: support other boards)
    - make -C ci/power_measurement/boards/rfsoc2x2 shared
    - make -C ci/power_measurement/boards/rfsoc4x2 shared
    # Install dependencies for FINN driver
    - sudo bash -c "source /etc/profile.d/pynq_venv.sh && chmod +x scripts/driver_install_dependencies.sh && scripts/driver_install_dependencies.sh"
    # Run as root and activate the PYNQ venv manually to use PYNQ outside of the typical Jupyter environment
    - sudo bash -c "source /etc/profile.d/pynq_venv.sh && export DATASET_DIR=$DATASET_DIR && export XILINX_XRT=/usr && export FINN_BENCH_EXCHANGE_DIR=$BOARD_EXCHANGE_DIR && export CI_PIPELINE_ID=$CI_PIPELINE_ID && python ci/measure.py --followup"
  artifacts:
    name: "measurement_artifacts_followup"
    when: always
    paths:
      - measurement_summary_followup.json
      - measurement_artifacts_followup/

Result Collection (Follow-up):
  id_tokens:
    CI_JOB_JWT:
      aud: https://git.uni-paderborn.de
  stage: collect_followup
  rules:
    # Also run on failure of previous tasks to measure partial results
    - when: always
  needs:
    - job: Result Collection
    - job: FINN Build (Follow-up)
    - job: Measurement (Follow-up)
  tags:
    - image_build
  script:
    # Check if follow-up config exists, exit gracefully if not
    - |
      if [ ! -f followup_bench_config.json ]; then
        echo "No follow-up config found, skipping follow-up result collection"
        exit 0
      fi
    # pulling models seems to be needed for dvclive to save experiments, even though they are not used or modified
    - dvc pull
    - git fetch origin +refs/tags/*:refs/tags/*
    - git fetch git@github.com:eki-project/finn-plus.git +refs/exps/*:refs/exps/*
    - |
      collect_status=0
      push_status=0

      export FINN_BENCH_EXCHANGE_DIR=$LOCAL_EXCHANGE_DIR
      python3.10 ci/collect/collect.py --followup || collect_status=$?
      dvc exp push -f -j 4 -r push git@github.com:eki-project/finn-plus.git || push_status=$?

      if [ "$collect_status" -ne 0 ]; then
        exit "$collect_status"
      fi
      exit "$push_status"
  artifacts:
    name: "all_artifacts"
    when: always
    paths:
      - build_artifacts/
      - measurement_artifacts/
      - followup_bench_config.json
      - followup_inputs/
      - run_index.json
      - build_artifacts_followup/
      - measurement_artifacts_followup/
      - run_index_followup.json
      - metric_report_plots_followup.png
      - metric_report_followup.json

# Empirical QoR estimation (see ci/qor/ and src/finn/qor/)
# Both jobs run on the runner that holds the benchmark database written by Result Collection.
# The scripts only need pandas/numpy/scikit-learn/matplotlib and import finn.qor from src/.

QoR Model Fitting:
  id_tokens:
    CI_JOB_JWT:
      aud: https://git.uni-paderborn.de
  stage: qor
  tags:
    - image_build
  rules:
    # Only microbenchmark runs add training data to the database.
    # Manual launches use BENCH_CFG="manual" and carry the config name in MANUAL_CFG_PATH.
    # Also run if previous jobs failed: the database may still have received new entries.
    - if: $BENCH_CFG =~ /^microbenchmark/ || $MANUAL_CFG_PATH =~ /microbenchmark/
      when: always
  needs:
    - job: Result Collection
  timeout: 4h
  script:
    # Isolated venv: the runner's system packages are outdated (e.g. jinja2) and the
    # scikit-learn version must match pyproject.toml so the pickled models load in builds.
    # torch (CPU wheel) enables the tabular transformer; symbolic regression (PySR/Julia)
    # runs in the separate manual job below because of its runtime.
    - python3.10 -m venv qor-venv
    - qor-venv/bin/pip install --quiet 'scikit-learn~=1.7.2' 'pandas~=2.3.1' 'matplotlib~=3.10.9' 'sympy~=1.14'
    - qor-venv/bin/pip install --quiet 'torch==2.12.0' --index-url https://download.pytorch.org/whl/cpu
    - |
      export FINN_MICROBENCHMARK_DATABASE=$LOCAL_BENCHMARK_DIR_STORE
      export FINN_QOR_MODEL_DIR=$LOCAL_QOR_MODEL_DIR_STORE
      qor-venv/bin/python ci/qor/fit_estimators.py --output-dir qor_fit_artifacts --skip-regressors SymbolicRegressor
  artifacts:
    name: "qor_fit_artifacts"
    when: always
    paths:
      - qor_fit_artifacts/

# Symbolic regression (PySR) of the QoR targets: interpretable formulas for the paper, not
# stored as models. Manual because of the runtime (hours) and the Julia dependency; the Julia
# depot is kept on the runner (LOCAL_QOR_JULIA_DEPOT) so only the first run installs it.
QoR Symbolic Regression:
  id_tokens:
    CI_JOB_JWT:
      aud: https://git.uni-paderborn.de
  stage: qor
  tags:
    - image_build
  rules:
    - if: $BENCH_CFG =~ /^microbenchmark/ || $MANUAL_CFG_PATH =~ /microbenchmark/
      when: manual
      allow_failure: true
  needs:
    - job: Result Collection
  timeout: 8h
  script:
    - python3.10 -m venv qor-venv
    - qor-venv/bin/pip install --quiet 'scikit-learn~=1.7.2' 'pandas~=2.3.1' 'matplotlib~=3.10.9' 'sympy~=1.14' 'pysr~=2.4'
    - |
      export FINN_MICROBENCHMARK_DATABASE=$LOCAL_BENCHMARK_DIR_STORE
      export JULIA_DEPOT_PATH=$LOCAL_QOR_JULIA_DEPOT
      export PYTHON_JULIAPKG_PROJECT=$LOCAL_QOR_JULIA_DEPOT/pyjuliapkg
      export PYTHON_JULIACALL_THREADS=auto
      mkdir -p $LOCAL_QOR_JULIA_DEPOT
      # the first import installs Julia and SymbolicRegression.jl into the depot
      qor-venv/bin/python -c "import pysr; print(pysr.__version__)"
      qor-venv/bin/python ci/qor/fit_estimators.py --output-dir qor_symbolic_artifacts --regressors SymbolicRegressor --no-store
      for backend in hls rtl; do
        qor-venv/bin/python ci/qor/fit_estimators.py --output-dir qor_symbolic_artifacts --regressors SymbolicRegressor --operators mvau --targets metrics.synth.resources.LUT --subset params.backend=$backend || true
      done
  artifacts:
    name: "qor_symbolic_artifacts"
    when: always
    paths:
      - qor_symbolic_artifacts/

QoR End2End Report:
  id_tokens:
    CI_JOB_JWT:
      aud: https://git.uni-paderborn.de
  stage: qor
  tags:
    - image_build
  rules:
    # Also run if previous jobs failed to report partial results (the script exits
    # gracefully if no artifacts are found)
    - if: $BENCH_CFG =~ /^regression/ || $MANUAL_CFG_PATH =~ /regression/
      when: always
  needs:
    - job: Result Collection
  script:
    - python3.10 -m venv qor-venv
    - qor-venv/bin/pip install --quiet 'pandas~=2.3.1' 'matplotlib~=3.10.9' 'jinja2>=3.1.2'
    - |
      export FINN_BENCH_EXCHANGE_DIR=$LOCAL_EXCHANGE_DIR
      qor-venv/bin/python ci/qor/end2end_report.py --output-dir qor_e2e_artifacts \
        --persist-to $LOCAL_BENCHMARK_DIR_STORE/end2end_evaluation/$(date +%Y-%m-%d)_${CI_COMMIT_SHORT_SHA}_${CI_PIPELINE_ID}_${MANUAL_CFG_PATH:-$BENCH_CFG}
  artifacts:
    name: "qor_e2e_artifacts"
    when: always
    paths:
      - qor_e2e_artifacts/

# Retention for the exchange directory: remove this pipeline's deployment packages (the
# reports are kept) and pipeline directories older than EXCHANGE_RETENTION_DAYS. Runs as the
# cluster user, which owns the large files.
Exchange Cleanup:
  id_tokens:
    CI_JOB_JWT:
      aud: https://git.uni-paderborn.de
  stage: cleanup
  tags:
    - otus_login
  rules:
    - when: always
  extends: .n2_setup_general
  script:
    - |
      export FINN_BENCH_EXCHANGE_DIR=$OTUS_EXCHANGE_DIR
      python3 ci/exchange_cleanup.py --pipeline --stale-days ${EXCHANGE_RETENTION_DAYS:-14}
