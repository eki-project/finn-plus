include: ci/.gitlab-setup.yml

stages:
  - sync
  - build
  - test

variables:
  PIPELINE_NAME:
    description: "Optional name to better identify this pipeline"
    value: ""
  TEST_SUITE:
    description: "Select test suite to run (fifo_model_ci runs only the TEG FIFO-sizing tests)"
    # TEMPORARY (feature/fifo_sizing_model): every pipeline of this branch runs the TEG FIFO-sizing
    # test suite and the regression configs with the abstract simulation sizing (see
    # BENCH_PARAM_OVERRIDES); restore "full_ci" and the empty override before merging into dev.
    value: "fifo_model_ci"
    options:
      - "none"
      - "quicktest_ci"
      - "full_ci"
      - "fifo_model_ci"
      - "milp_scaling"
  PYTEST_WORKERS:
    description: "Select number PyTest workers"
    value: "64"
  PYTEST_FINN_WORKERS:
    description: "Select number of FINN workers per PyTest worker"
    value: "4"
  BENCH_CPU_CORES:
    description: "Select number of CPU cores for each regression/benchmark run"
    value: "32"
  BENCH_FINN_WORKERS:
    description: "Select number of FINN workers for each regression/benchmark run"
    value: "32"
  MEM_BENCH:
    description: "Select memory for each regression/benchmark run"
    value: "256G"
  PARALLEL_JOBS:
    description: "Number of parallel Slurm array jobs per Benchmark job"
    value: "8"
  SLURM_TIMEOUT:
    description: "Select SLURM timeout"
    value: "1-0" # [days-hours]
  PYTEST_SLURM_PARTITION:
    description: "Slurm partition (e.g., normal, largemem, fpga, gpu)"
    value: "fpga"
  BENCH_SLURM_PARTITION:
    description: "Slurm partition (e.g., normal, largemem, fpga, gpu)"
    value: "normal"
  SLURM_EXCLUDE_NODES:
    description: "Slurm nodes, which should not be used by the CI"
    value: "fpga[1607-1614]"
  SLURM_QOS:
    description: "Optional --exclusive or QoS option (include --qos, e.g., --qos express)"
    value: ""
  MANUAL_CFG_PATH:
    description: "Name (in ci/cfg/) or path (relative to LOCAL_CFG_DIR) of benchmarking config to run"
    value: ""
  MILP_SCALING_PLAN:
    description: "TEST_SUITE = milp_scaling: preset (smoke, cluster, cluster_full) or path of a plan file, see tests/fpgadataflow/teg/test_teg_milp_scaling.py"
    value: "smoke"
  MILP_SCALING_SOLVER:
    description: "TEST_SUITE = milp_scaling: MILP solver (highs or gurobi)"
    value: "gurobi"
  MILP_SCALING_TIME_LIMIT:
    description: "TEST_SUITE = milp_scaling: solver time limit per instance in seconds"
    value: "3600"
  MILP_SCALING_THREADS:
    description: "TEST_SUITE = milp_scaling: solver threads (0: all cores of the node)"
    value: "0"
  MILP_SCALING_MEM_LIMIT_GB:
    description: "TEST_SUITE = milp_scaling: soft memory limit of a solve in GB (Gurobi stops with its best solution)"
    value: "600"
  MILP_SCALING_MAX_CONSTRAINTS:
    description: "TEST_SUITE = milp_scaling: instances with more constraint rows are only sized, not solved (0: no limit)"
    value: "0"
  BENCH_PARAM_OVERRIDES:
    description: "Optional JSON object of build parameters applied to every run of every bench job, e.g. {\"auto_fifo_depths\": true, \"auto_fifo_strategy\": \"abstract_sim\"} to run the regression suite with the TEG-based FIFO sizing"
    # TEMPORARY (feature/fifo_sizing_model): the regression suite always builds with the TEG-based
    # abstract simulation sizing on this branch; restore "" before merging into dev.
    value: '{"auto_fifo_depths": true, "auto_fifo_strategy": "abstract_sim"}'

workflow:
  name: '$PIPELINE_NAME'
  rules:
    # Run pipeline for GitHub PRs to dev (does not support PRs from forks)
    - if: $CI_PIPELINE_SOURCE == "external_pull_request_event" && $CI_EXTERNAL_PULL_REQUEST_TARGET_BRANCH_NAME == "dev"
    # Run pipeline for pushes to dev or main
    - if: $CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main"
    # Run pipeline if manually triggered via API or web GUI
    - if: $CI_PIPELINE_SOURCE == "api"
    - if: $CI_PIPELINE_SOURCE == "web"
    # Run pipeline if scheduled (only for nightly sync of finn-dev)
    - if: $CI_PIPELINE_SOURCE == "schedule"

Sync finn-dev:
  id_tokens:
    CI_JOB_JWT:
      aud: https://git.uni-paderborn.de
  stage: sync
  tags:
    # Run where full Docker + Singularity is available
    - image_build
  rules:
    # Only run on a schedule
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script:
    - mkdir -p ../github_clone && cd ../github_clone
    - rm -rf finn-plus # Ensure we do a fresh clone (TODO: better way to handle this on job level?)
    - git clone git@github.com:eki-project/finn-plus.git && cd finn-plus
    - git remote add upstream https://github.com/Xilinx/finn.git
    - git checkout finn-dev
    - git pull upstream dev
    - git push origin finn-dev

Build:
  id_tokens:
    CI_JOB_JWT:
      aud: https://git.uni-paderborn.de
  stage: build
  tags:
    - otus_login
  rules:
    # Do not run on a schedule
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    # Otherwise run
    - when: always
  before_script:
    - !reference [.n2_setup_general, before_script]
    - !reference [.n2_setup_xilinx_2024_2, before_script]
    # Install current version of Poetry
    - python3 -m venv poetry-install
    - poetry-install/bin/pip install poetry
    - shopt -s expand_aliases
    - alias poetry=poetry-install/bin/poetry
  script:
    # Let Poetry create virtual environment (.venv) and install Python dependencies
    # TODO: is it possible to cache the entire venv for the following jobs?
    - poetry install
    # Build .whl finn-plus package. The test suite is not packaged: the test job runs the
    # tests/ directory of this checkout against the installed wheel.
    - poetry build --clean --format=wheel
    # Let FINN download additional dependencies, cache resulting deps directory
    # Also fetch & checkout DVC-managed data, $CI_DVC_CACHE_DIR persists between jobs
    - |
      source .venv/bin/activate
      finn deps update --dependency-path ./deps --accept-defaults
      dvc config cache.dir $CI_DVC_CACHE_DIR
      bash ci/retry.sh -n 4 -d 15 -- dvc pull
  artifacts:
    name: "finn-plus_package"
    paths:
      - dist/*.whl
    expire_in: 1 week
  cache:
    key:
      files:
        - src/finn/interface/external_dependencies.yaml
    paths:
      - deps

FINN Test Suite 2024.2:
  id_tokens:
    CI_JOB_JWT:
      aud: https://git.uni-paderborn.de
  stage: test
  tags:
    - otus
  rules:
    # Do not run on a schedule
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    # Do not run if test suite has been deselected
    - if: $TEST_SUITE == "none"
      when: never
    # Always run, as long as there was no prior failure
    - when: on_success
  cache:
    key:
      files:
        - src/finn/interface/external_dependencies.yaml
    policy: pull
    paths:
      - deps
  variables:
    SCHEDULER_PARAMETERS: "-A $PROJECT_ACCOUNT -p $PYTEST_SLURM_PARTITION -t $SLURM_TIMEOUT $SLURM_QOS --nodes 1 --ntasks 1 --exclusive --exclude $SLURM_EXCLUDE_NODES"
    PYTEST_PARALLEL: "$PYTEST_WORKERS"
    # Avoid fork-based multiprocessing (unsafe with threaded native libraries and
    # going away in Python 3.14). Must be spawn, not forkserver: the forkserver
    # daemon caches the environment from its first use, which would pin workers
    # to a stale FINN_BUILD_DIR.
    FINN_MP_START_METHOD: "spawn"
  extends: .setup_full_2024_2
  script:
    # Launch additional monitoring
    - $JOB_MONITORING_DIR/monitor.sh $JOB_MONITORING_DIR/$CI_PIPELINE_ID/$HOSTNAME.log &
    # Launch FINN via test command, includes preparation of (cached) dependencies
    # Also fetch & checkout DVC-managed data, which should already be cached in $CI_DVC_CACHE_DIR
    - |
      source finn-plus-venv/bin/activate
      dvc config cache.dir $CI_DVC_CACHE_DIR
      bash ci/retry.sh -n 4 -d 15 -- dvc pull
      finn test --variant $TEST_SUITE --tests-path ./tests --dependency-path ./deps --build-path $FINN_BUILD_DIR --num-test-workers $PYTEST_WORKERS -n $PYTEST_FINN_WORKERS
  artifacts:
    name: "test_reports"
    when: always
    paths:
      - reports/
    reports:
      junit: reports/*.xml

Bench (Manual):
  stage: test
  rules:
    # Do not run on a schedule
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    # The MILP scaling experiments are a single long test job; no regression builds
    - if: $TEST_SUITE == "milp_scaling"
      when: never
    # TEMPORARY (feature/fifo_sizing_model): manual configs run with every test-suite selection
    - if: $MANUAL_CFG_PATH != ""
  trigger:
    include: ci/.gitlab-bench.yml
    strategy: depend
    forward:
      pipeline_variables: true
  variables:
    PARENT_PIPELINE_ID: $CI_PIPELINE_ID
    BENCH_CFG: "manual"
    BENCH_CFG_PARALLEL_JOBS: $PARALLEL_JOBS
    BENCH_CFG_CPU_CORES: $BENCH_CPU_CORES
    BENCH_CFG_FINN_WORKERS: $BENCH_FINN_WORKERS
    BENCH_CFG_MEM: $MEM_BENCH

Bench (Basic):
  stage: test
  rules:
    # Do not run on a schedule
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    # The MILP scaling experiments are a single long test job; no regression builds
    - if: $TEST_SUITE == "milp_scaling"
      when: never
    # TEMPORARY (feature/fifo_sizing_model): the regression configs run with every test-suite
    # selection (they build with the abstract simulation sizing, see BENCH_PARAM_OVERRIDES)
    - if: $MANUAL_CFG_PATH == ""
  trigger:
    include: ci/.gitlab-bench.yml
    strategy: depend
    forward:
      pipeline_variables: true
  variables:
    PARENT_PIPELINE_ID: $CI_PIPELINE_ID
  parallel:
    matrix:
      # One Slurm array task per experiment of the config, so the parallel job count has to be
      # kept in sync with the number of experiments in ci/cfg/<BENCH_CFG>.yml. The large models
      # need a bigger node than the rest, hence the split into two configs. The resources are
      # passed under config-scoped names (see ci/.gitlab-bench.yml): the pipeline-level names
      # are forwarded as pipeline variables and would override per-config values here.
      - BENCH_CFG: [regression_small]
        BENCH_CFG_PARALLEL_JOBS: "13"
        BENCH_CFG_CPU_CORES: $BENCH_CPU_CORES
        BENCH_CFG_FINN_WORKERS: $BENCH_FINN_WORKERS
        BENCH_CFG_MEM: $MEM_BENCH
      - BENCH_CFG: [regression_large]
        BENCH_CFG_PARALLEL_JOBS: "3"
        BENCH_CFG_CPU_CORES: "128"
        BENCH_CFG_FINN_WORKERS: "128"
        BENCH_CFG_MEM: "512G"

Bench (Extended):
  stage: test
  rules:
    # TEMPORARY (feature/fifo_sizing_model): the microbenchmarks are not affected by the FIFO
    # sizing work and are not run on this branch; remove this rule before merging into dev
    - when: never
    # Do not run on a schedule
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    # The MILP scaling experiments are a single long test job; no regression builds
    - if: $TEST_SUITE == "milp_scaling"
      when: never
    # The FIFO-model test suite is a targeted unit-test run; no regression builds
    - if: $TEST_SUITE == "fifo_model_ci"
      when: never
    # Do not run for PRs to dev (run only for pushes)
    - if: $CI_PIPELINE_SOURCE == "external_pull_request_event" && $CI_EXTERNAL_PULL_REQUEST_TARGET_BRANCH_NAME == "dev"
      when: never
    - if: $MANUAL_CFG_PATH == ""
  trigger:
    include: ci/.gitlab-bench.yml
    strategy: depend
    forward:
      pipeline_variables: true
  variables:
    PARENT_PIPELINE_ID: $CI_PIPELINE_ID
    BENCH_CFG_PARALLEL_JOBS: "8"
    BENCH_CFG_CPU_CORES: $BENCH_CPU_CORES
    BENCH_CFG_FINN_WORKERS: $BENCH_FINN_WORKERS
    BENCH_CFG_MEM: $MEM_BENCH
  parallel:
    matrix:
      - BENCH_CFG: [microbenchmark_basic]
