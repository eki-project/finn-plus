name: Release Python Package to PyPI

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Setup
        run: pip install poetry poetry-dynamic-versioning
      - name: Config
        run: poetry config repositories.pypi https://upload.pypi.org/legacy/
      - name: Build driver subpackage
        run: |
          cd driver
          poetry build
          cd ..
      - name: Build main package
        run: |
          poetry build
      - name: Publish all packages
        run: |
          # Publish driver subpackage
          # Note: this is the runtime driver installed on PYNQ boards. It is deliberately not
          # a dependency of the main package, which runs on the build host.
          cd driver
          poetry publish -r pypi -u __token__ -p ${{ secrets.PYPI_TOKEN }}
          cd ..

          # Publish main package
          poetry publish -r pypi -u __token__ -p ${{ secrets.PYPI_TOKEN }}
  test:
    runs-on: ubuntu-24.04
    needs: deploy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Setup
        run: pip install poetry poetry-dynamic-versioning
      # A plain install must be usable on its own: the test suite and its dependencies are
      # optional, so nothing on the CLI's import path may depend on them.
      - name: Install plain package and run the CLI
        run: |
          pip install finn-plus==$(poetry version -s)
          finn --version
          finn --help
      - name: Install with the test tooling
        run: pip install finn-plus[test]==$(poetry version -s)
